name: Feature proposal
description: Propose one user outcome before implementation.
title: '[Feature] '
body:
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: Who needs what, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable success and failure cases.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: Include privacy/storage implications, dependencies and what is deferred.
  - type: input
    id: spec
    attributes:
      label: Roadmap or specification reference
      description: Link an existing milestone/spec if applicable; avoid duplicating its task list.
