<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Incanta - Chat with Celeste</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <header>
      <h1>Incanta</h1>
      <h2>Chat with Celeste</h2>
      <p id="readiness-label" role="status">Checking readiness…</p>
      <button id="refresh-status" type="button">Check readiness</button>
      <div id="emotion-label">Current Emotion: Neutral</div>
    </header>

    <section id="chat-messages" class="chat-box" aria-live="polite"></section>

    <form id="chat-form">
      <input type="text" id="chat-input" aria-label="Message" placeholder="Say something to Celeste..." autocomplete="off" />
      <button id="send-button" type="submit">Send</button>
    </form>

    <p id="chat-error" role="alert"></p>
    <button id="toggle-gauges" aria-expanded="true" aria-controls="gauge-container">Hide Gauges</button>
    <div id="gauge-container">
      <div class="gauge"><div class="gauge-fill" id="gauge-Trust">Trust: 0</div></div>
      <div class="gauge"><div class="gauge-fill" id="gauge-Intimacy">Intimacy: 0</div></div>
      <div class="gauge"><div class="gauge-fill" id="gauge-Curiosity">Curiosity: 0</div></div>
      <div class="gauge"><div class="gauge-fill" id="gauge-Affection">Affection: 0</div></div>
      <div class="gauge"><div class="gauge-fill" id="gauge-Confidence">Confidence: 0</div></div>
      <div class="gauge"><div class="gauge-fill" id="gauge-Confusion">Confusion: 0</div></div>
      <div class="gauge"><div class="gauge-fill" id="gauge-Arousal">Arousal: 0</div></div>
    </div>
  </div>

  <script src="chat_helpers.js"></script>
  <script src="app.js"></script>
</body>
</html>
